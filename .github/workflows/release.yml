name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  build-and-release:
    name: Build, Sign and Draft Release
    runs-on: windows-latest

    steps:
      # 1. Check out tagged commit
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup .NET 10 SDK
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Restore and compile solution
      - name: Build solution (Release)
        run: dotnet build -c Release

      # 4. Run unit tests
      - name: Run unit tests
        run: dotnet test -c Release --no-build

      # 5. Extract version number from tag (e.g. v2.0.0 -> 2.0.0)
      - name: Extract version
        id: get_version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
          Write-Output "VERSION=$tag" >> $env:GITHUB_ENV
          Write-Output "Extracted version: $tag"

      # 6. Publish three executables (self-contained single-file win-x64)
      - name: Publish executables
        shell: pwsh
        run: |
          dotnet publish src/Delima.Launcher/Delima.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/Launcher
          dotnet publish src/Delima.Admin/Delima.Admin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/Admin
          dotnet publish src/Delima.Provision/Delima.Provision.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/Provision

      # 7. Install Inno Setup (pinned version for reproducibility & SignPath origin verification)
      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e -v 6.7.3 --silent `
            --accept-package-agreements --accept-source-agreements
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      # 8. Build Inno Setup installer package
      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DMyAppVersion=$env:VERSION installer/DelimaLauncher.iss

      # 9. Generate SHA-256 Checksums of the installer
      - name: Generate SHA-256 checksums of installer
        shell: pwsh
        run: |
          Get-FileHash dist/DELIMaLauncher-Setup-$env:VERSION.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File "dist/DELIMaLauncher-$env:VERSION-checksums.txt" -Encoding ascii
          Get-Content "dist/DELIMaLauncher-$env:VERSION-checksums.txt"

      # 10. Upload installer artifact to GitHub Actions run
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DELIMaLauncher-Setup-${{ env.VERSION }}
          path: dist/DELIMaLauncher-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error

      # 11. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          name: "DELIMa Smart Launcher v${{ env.VERSION }}"
          body: |
            ## DELIMa Smart Launcher v${{ env.VERSION }}

            Pemasang rasmi DELIMa Smart Launcher bagi makmal komputer sekolah rendah (SK Seksyen 24).

            ---

            ### Perakuan Tanggungjawab Sekolah

            **1. Apa yang disimpan.**
            Perisian ini menyimpan kata laluan akaun DELIMa murid pada komputer sekolah anda. Kata laluan tersebut disulitkan dan disimpan pada komputer makmal berkenaan sahaja. Tiada salinan dihantar ke mana-mana pelayan luar, dan pembangun perisian ini tidak menerima sebarang data.

            **2. Tiada pendirian rasmi diperoleh.**
            Setakat ini, tiada pendirian bertulis diperoleh daripada Kementerian Pendidikan Malaysia (KPM) atau Bahagian Sumber dan Teknologi Pendidikan (BSTP) mengenai amalan menyimpan kata laluan murid dan mengisinya semula secara automatik. Ini bermakna amalan tersebut **tidak pernah disahkan, dan tidak pernah dilarang**, oleh mana-mana pihak berkuasa.

            **3. Tanggungjawab sekolah.**
            Sekolah yang memasang perisian ini bertanggungjawab sepenuhnya ke atas kata laluan murid yang disimpan — termasuk keputusan untuk menggunakannya, cara ia dilindungi, dan pematuhan terhadap mana-mana dasar atau perundangan yang terpakai. Tanggungjawab untuk menilai amalan ini dan mendapatkan kelulusan daripada pihak berkuasa yang berkenaan terletak pada pihak sekolah, bukan pada pembangun perisian.

            **4. Tanpa jaminan.**
            Perisian ini diberikan secara percuma dan tanpa sebarang jaminan.

            ---

            ### Senarai Fail Muat Turun
            - `DELIMaLauncher-Setup-${{ env.VERSION }}.exe` — Pemasang Windows tunggal (Inno Setup 64-bit)
            - `DELIMaLauncher-${{ env.VERSION }}-checksums.txt` — Hash integriti SHA-256 bagi fail pemasang
            - `Panduan_Pemasangan.pdf` — Panduan persediaan makmal komputer (10 muka surat BM)
            - `Panduan_Import.pdf` — Panduan format dan pengimportan data murid/kata laluan
            - `contoh_roster.csv` & `contoh_kata_laluan.csv` — Templat CSV APDM
          files: |
            dist/DELIMaLauncher-Setup-${{ env.VERSION }}.exe
            dist/DELIMaLauncher-${{ env.VERSION }}-checksums.txt
            installer/assets/Panduan_Pemasangan.pdf
            installer/assets/Panduan_Import.pdf
            installer/assets/contoh_roster.csv
            installer/assets/contoh_kata_laluan.csv
